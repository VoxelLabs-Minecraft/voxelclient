version: 2

updates:

  # ── Gradle (Fabric Mod Dependencies) ──────────────────────
  - package-ecosystem: "gradle"
    directory: "/"

    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Berlin"

    open-pull-requests-limit: 10

    labels:
      - "dependencies"
      - "fabric"
      - "automated"

    commit-message:
      prefix: "chore(deps)"
      include: "scope"

    groups:

      fabric-core:
        patterns:
          - "net.fabricmc*"
          - "fabric-*"
        update-types:
          - "minor"
          - "patch"

      minecraft-libs:
        patterns:
          - "com.mojang*"
          - "org.lwjgl*"
        update-types:
          - "minor"
          - "patch"

      all-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    ignore:

      - dependency-name: "net.fabricmc:fabric-loader"
        update-types:
          - "version-update:semver-major"

      - dependency-name: "net.fabricmc.fabric-api:fabric-api"
        update-types:
          - "version-update:semver-major"

      - dependency-name: "com.mojang:minecraft"
        update-types:
          - "version-update:semver-major"

  # ── GitHub Actions (CI/CD) ────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"
      - "github-actions"
      - "automated"

    commit-message:
      prefix: "chore(ci)"
      include: "scope"