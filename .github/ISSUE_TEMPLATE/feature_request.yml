name: Feature Request
description: Suggest a new feature
title: "[Feature]: "
labels:
  - enhancement

body:

  - type: markdown
    attributes:
      value: |
        Thank you for your suggestion.

  - type: textarea
    id: feature
    attributes:
      label: Feature Description
      placeholder: Describe your idea
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      placeholder: How should it work?